# PPO decides dwell time and when to stop; the next frequency is chosen by
# expected information gain under the current belief (meas_rl.belief).
name: ppo_dwellstop
algo: ppo
total_timesteps: 300000
n_envs: 8
gamma: 0.99
env_kwargs:
  action_mode: dwell_stop
hyperparams:
  n_steps: 128          # per env, so 1024 transitions per update
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  policy_kwargs:
    net_arch: [64, 64]
